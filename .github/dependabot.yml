
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 10

    labels:
      - "dependencies"
      - "security"

    commit-message:
      prefix: "deps"
      include: "scope"

    versioning-strategy: "increase"

    groups:
      production-and-development:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"


  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"

    open-pull-requests-limit: 5

    labels:
      - "github-actions"
      - "dependencies"

    commit-message:
      prefix: "ci"
      include: "scope"
